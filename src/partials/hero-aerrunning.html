
      <!-- En-tête d'Aer : une conversation iMessage (fictive) avec le fabricant, chaque étape partagée en photo.
           Sans JavaScript, tous les messages restent affichés ; sinon ils arrivent un par un (site.js) -->
      <section class="chat" aria-label="From an idea to a tested shirt, told as a conversation with the manufacturer">
        <div class="chat__phone">
          <div class="chat__top">
            <span class="chat__avatar" aria-hidden="true">M</span>
            <b>Manufacturer</b>
          </div>
          <div class="chat__thread">
            <p class="chat__time">Today 09:41</p>
            <div class="msg them"><p>Hi Maxence! Ready when you are for Aer.</p></div>
            <div class="msg me"><p>Here’s the idea: a mascot that runs</p></div>
            <div class="msg me pic"><img src="assets/img/kzvobKZjaLgMI9JuEih64LTkA.png" alt="The Aer mascot"></div>
            <div class="msg them"><p>Love it. Can you send the flats?</p></div>
            <div class="msg me pic"><img src="assets/img/T7gjRYXknydB1RDvBy721xWio.png" alt="Flat drawings of the long sleeve"></div>
            <div class="msg them"><p>First sample is on its way</p></div>
            <div class="msg me pic"><img src="assets/aer/worn-sm.jpg" alt="Maxence wearing the Aer long sleeve"></div>
            <div class="msg me"><p>Tested it on the trails</p></div>
            <div class="msg me pic"><video src="assets/aer/tested.mp4" poster="assets/aer/tested.jpg" muted loop playsinline aria-label="Running in the fog in the long sleeve"></video></div>
            <div class="msg them"><p>Looks great. Let’s produce it.</p></div>
          </div>
        </div>
      </section>
