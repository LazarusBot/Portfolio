<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <!-- Aperçu sur les réseaux : vidéo en boucle (iMessage, Discord, Telegram), image pour les autres (LinkedIn, X, WhatsApp) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maxence Prioux">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{site}}/{{pagePath}}">
  <meta property="og:image" content="{{site}}/assets/og/og-chess.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Chess.com line from maxence.fyi: Puzzles personal best 1426, +14">
  <meta property="og:video" content="{{site}}/assets/og/og-chess.mp4">
  <meta property="og:video:secure_url" content="{{site}}/assets/og/og-chess.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1200">
  <meta property="og:video:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site}}/assets/og/og-chess.jpg">
  <link rel="icon" href="favicon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500&family=Caveat&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
